<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>Suhel — Full-Stack Developer & AI Builder</title>
  <meta name="description"
    content="Portfolio of Suhel — Full-Stack Developer and AI Builder crafting intelligent digital systems with React, Node.js, and AI technologies." />
  <meta name="author" content="Suhel" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
  <link rel="canonical" href="https://suhel-developer-portfolio.vercel.app/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://suhel-developer-portfolio.vercel.app/" />
  <meta property="og:title" content="Suhel — Full-Stack Developer & AI Builder" />
  <meta property="og:description"
    content="Building intelligent digital systems with React, Node.js, and AI technologies." />
  <meta property="og:site_name" content="Suhel Portfolio" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Suhel — Full-Stack Developer & AI Builder" />
  <meta name="twitter:description"
    content="Building intelligent digital systems with React, Node.js, and AI technologies." />

  <!-- Theme & Icons -->
  <meta name="theme-color" content="#F8F8F6" />
  <meta name="color-scheme" content="light" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="apple-touch-icon" href="/vite.svg" />

  <!-- Performance: Preconnect to font CDN (before loading fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

  <!-- Font: swap display to prevent invisible text during load -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />

  <!-- Structured Data (JSON-LD) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Suhel",
      "url": "https://suhel-developer-portfolio.vercel.app",
      "jobTitle": "Full-Stack Developer & AI Builder",
      "description": "Building intelligent digital systems with React, Node.js, and AI technologies.",
      "sameAs": [
        "https://github.com/yourprofile",
        "https://linkedin.com/in/yourprofile"
      ]
    }
  </script>

  <!-- Critical inline styles to prevent FOUC (flash of unstyled content) -->
  <style>
    /* Prevent layout shift while JS loads */
    #root {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--color-milky, #F8F8F6);
    }

    /* Hide content until React hydrates — loader will show first */
    body {
      margin: 0;
      background-color: var(--color-milky, #F8F8F6);
      color: var(--color-dark, #000000);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
</head>

<body>
  <!-- No-JS fallback -->
  <noscript>
    <div style="text-align:center;padding:3rem;font-family:system-ui">
      <h1>JavaScript Required</h1>
      <p>Please enable JavaScript to view Suhel's portfolio.</p>
    </div>
  </noscript>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
