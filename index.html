<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>Suhel Ansari | AI Full-Stack Developer</title>
  <meta name="description"
    content="Portfolio of Suhel Ansari — AI Full-Stack Developer building intelligent digital systems, real-time architectures, and SaaS applications with React, Node.js, and AI technologies." />

  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
  <link rel="canonical" href="https://suhel-developer-portfolio.vercel.app/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://suhel-developer-portfolio.vercel.app/" />
  <meta property="og:title" content="Suhel Ansari | AI Full-Stack Developer" />
  <meta property="og:description"
    content="Portfolio of Suhel Ansari — AI Full-Stack Developer building intelligent digital systems, real-time architectures, and SaaS applications." />
  <meta property="og:site_name" content="Suhel Ansari Portfolio" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:image" content="https://suhel-developer-portfolio.vercel.app/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Suhel Ansari — SA Brand Identity & Portfolio" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Suhel Ansari | AI Full-Stack Developer" />
  <meta name="twitter:description"
    content="Portfolio of Suhel Ansari — AI Full-Stack Developer building intelligent digital systems, real-time architectures, and SaaS applications." />
  <meta name="twitter:image" content="https://suhel-developer-portfolio.vercel.app/og-image.jpg" />
  <meta name="twitter:image:alt" content="Suhel Ansari — SA Brand Identity & Portfolio" />

  <!-- Theme & Icons -->
  <meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#F8F8F6" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Performance: Preconnect to font CDN (before loading fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

  <!-- Font: swap display to prevent invisible text during load -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />

  <!-- Structured Data (JSON-LD) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Suhel Ansari",
      "url": "https://suhel-developer-portfolio.vercel.app",
      "jobTitle": "AI Full-Stack Developer",
      "description": "AI Full-Stack Developer building intelligent digital systems, real-time architectures, and SaaS applications with React, Node.js, and AI technologies.",
      "sameAs": [
        "https://github.com/AmirCodes-786",
        "https://www.linkedin.com/in/suhel-ansari-2a932224b"
      ]
    }
  </script>

  <!-- Prevent theme FOUC -->
  <script>
    if (localStorage.theme === 'dark') {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>

  <!-- Critical inline styles to prevent FOUC (flash of unstyled content) -->
  <style>
    /* Prevent layout shift while JS loads */
    #root {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--color-milky, #F8F8F6);
    }

    /* Hide content until React hydrates — loader will show first */
    body {
      margin: 0;
      background-color: var(--color-milky, #F8F8F6);
      color: var(--color-dark, #000000);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
</head>

<body>
  <!-- No-JS fallback -->
  <noscript>
    <div style="text-align:center;padding:3rem;font-family:system-ui">
      <h1>JavaScript Required</h1>
      <p>Please enable JavaScript to view Suhel's portfolio.</p>
    </div>
  </noscript>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
