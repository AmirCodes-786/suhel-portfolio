<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Circle Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a120e" />
      <stop offset="65%" stop-color="#050706" />
      <stop offset="100%" stop-color="#020302" />
    </radialGradient>

    <!-- Emerald Glow Filter -->
    <filter id="emeraldFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="starFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Metallic Brushed Steel Gradients -->
    <linearGradient id="steelLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="25%" stop-color="#CBD5E1" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="75%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <linearGradient id="steelDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Emerald Orbit Gradient -->
    <linearGradient id="emeraldNeon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="85%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>

    <linearGradient id="emeraldOrbitThin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Dark Base Circle -->
  <circle cx="60" cy="60" r="56" fill="url(#bgGlow)" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- Thin Outer Glowing Orbit Ring -->
  <circle cx="60" cy="60" r="51" fill="none" stroke="url(#emeraldOrbitThin)" stroke-width="0.8" opacity="0.8" />

  <!-- S+A MONOGRAM -->
  <g id="monogram" transform="translate(60,60) scale(0.92) translate(-60,-60)">
    
    <!-- "A" Shadow / Bevel Base -->
    <path d="M 68 34 L 97 78 L 84 81 L 76 66 L 56 66 L 49 79 L 36 76 L 68 34 Z" fill="url(#steelDark)" opacity="0.85" />

    <!-- "A" Primary Face -->
    <path d="M 69 35 L 94 76 L 82 78 L 75 64 L 58 64 L 51 77 L 39 74 L 69 35 Z" fill="url(#steelLight)" />
    <!-- "A" Triangle Cutout -->
    <polygon points="69,47 61,60 73,60" fill="url(#steelDark)" />

    <!-- "S" Extruded 3D Depth / Dark Bevel -->
    <path d="M 32 47 C 32 40 40 37 58 37 L 66 37 L 62 44 L 54 44 C 42 44 38 46 38 49 C 38 52 43 54 53 56 L 62 58 C 74 61 78 67 78 74 C 78 83 67 86 50 86 L 27 86 L 35 77 L 49 77 C 62 77 68 75 68 71 C 68 67 63 65 53 63 L 44 61 C 34 58 32 53 32 47 Z" fill="url(#steelDark)" opacity="0.9" />

    <!-- "S" Primary Brushed Face -->
    <path d="M 34 46 C 34 41 41 38 57 38 L 65 38 L 62 43 L 55 43 C 43 43 39 45 39 48 C 39 51 44 53 54 55 L 63 57 C 73 60 77 65 77 72 C 77 81 66 84 51 84 L 29 84 L 35 77 L 50 77 C 61 77 67 75 67 71 C 67 68 63 65 53 63 L 44 61 C 35 59 34 53 34 46 Z" fill="url(#steelLight)" />

    <!-- Sparkle Star under "A" crossbar -->
    <g transform="translate(68, 71)" filter="url(#starFilter)">
      <path d="M 0,-7 Q 0,0 7,0 Q 0,0 0,7 Q 0,0 -7,0 Q 0,0 0,-7 Z" fill="#00FF88" />
      <circle cx="0" cy="0" r="1.2" fill="#FFFFFF" />
    </g>

    <!-- DYNAMIC SWOOSHING EMERALD ORBITAL RING -->
    <!-- Back / Under segment of orbit ring -->
    <path d="M 23 72 C 28 65 39 58 54 53 C 68 48 83 44 94 43" fill="none" stroke="#059669" stroke-width="2.2" opacity="0.4" />

    <!-- Front / Glowing Primary Swoosh slicing through SA -->
    <path d="M 16 73 C 24 73 40 68 61 58 C 82 48 98 39 104 35 C 100 37 81 49 59 59 C 38 69 22 74 16 73 Z" fill="url(#emeraldNeon)" filter="url(#emeraldFilter)" />
    <!-- Bright Hot Core of Orbit -->
    <path d="M 20 72 C 32 70 52 62 72 53 C 90 44 100 36 102 35.5" fill="none" stroke="#E6FFFA" stroke-width="0.9" opacity="0.9" />

  </g>
</svg>
